<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Workspace — BioMaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" href="/favicon.ico">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:'Inter',system-ui,sans-serif;font-size:15px;background:#0c1a0f;color:#d0edd8;height:100%}
body{height:100%;display:flex;flex-direction:column;overflow:hidden}

:root{
  --bg0:#0c1a0f;--bg1:#111f14;--bg2:#162218;--bg3:#1c2e20;--bg4:#233826;
  --green:#2f8b4d;--green-b:#4ade80;--green-s:rgba(47,139,77,.15);--green-s2:rgba(47,139,77,.07);
  --text:#d0edd8;--muted:#6fa07a;--dim:#4a7a58;
  --border:rgba(80,180,100,.1);--border-b:rgba(80,180,100,.22);
  --red:#c45252;--red-s:rgba(196,82,82,.14);
  --yellow:#c89a12;--yellow-s:rgba(200,154,18,.14);
  --blue:#2b6ea3;--blue-s:rgba(43,110,163,.14);
  --orange:#c46a2f;--orange-s:rgba(196,106,47,.14);
  --purple:#7c4dab;--purple-s:rgba(124,77,171,.14);
  --sidebar:220px;--topbar:52px;--r:10px;--rs:6px;
  --shadow:0 4px 24px rgba(0,0,0,.45);--shadow-s:0 2px 10px rgba(0,0,0,.3);
  --t:.17s ease;
}

/* ─── LOAD SCREEN ─── */
#loadScreen{
  position:fixed;inset:0;background:var(--bg0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;
  z-index:9999;transition:opacity .3s;
}
#loadScreen.out{opacity:0;pointer-events:none}
.load-brand{display:flex;align-items:center;gap:.65rem;font-size:1.15rem;font-weight:800;color:var(--text)}
.load-dot{width:11px;height:11px;border-radius:50%;background:var(--green-b);animation:pulse 1.1s infinite}
.load-spin{width:26px;height:26px;border:2px solid var(--border-b);border-top-color:var(--green-b);border-radius:50%;animation:spin .7s linear infinite}
.load-msg{color:var(--muted);font-size:.83rem}

/* ─── APP SHELL ─── */
#wsApp{display:flex;height:100vh;opacity:0;transition:opacity .35s}
#wsApp.show{opacity:1}

/* ─── SIDEBAR ─── */
#sidebar{
  width:var(--sidebar);min-width:var(--sidebar);background:var(--bg1);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  height:100vh;position:sticky;top:0;overflow:hidden;flex-shrink:0;
}
.sb-head{
  padding:.95rem 1rem .8rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.6rem;
}
.sb-logo{
  width:30px;height:30px;background:var(--green);border-radius:7px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sb-logo svg{width:17px;height:17px;fill:white}
.sb-brand{display:flex;flex-direction:column}
.sb-name{font-size:.82rem;font-weight:800;color:var(--text)}
.sb-sub{font-size:.66rem;color:var(--muted)}

.sb-nav{flex:1;padding:.4rem 0;overflow-y:auto;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.nav-label{font-size:.63rem;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;padding:.75rem 1rem .25rem}
.nav-item{
  display:flex;align-items:center;gap:.65rem;padding:.52rem 1rem;
  margin:0 .35rem;border-radius:var(--rs);cursor:pointer;
  color:var(--muted);font-size:.83rem;font-weight:500;
  transition:background var(--t),color var(--t);position:relative;
  text-decoration:none;
}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--green-s);color:var(--green-b)}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;flex-shrink:0;stroke-width:2}
.nav-badge{
  margin-left:auto;background:var(--red);color:#fff;
  font-size:.63rem;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;
}

.sb-foot{padding:.75rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.4rem}
.admin-card{
  display:flex;align-items:center;gap:.6rem;
  padding:.55rem .7rem;border-radius:var(--rs);background:var(--bg2);
}
.admin-av{
  width:29px;height:29px;border-radius:50%;background:var(--green);
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:700;color:#fff;flex-shrink:0;
}
.admin-name{font-size:.77rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-role{font-size:.63rem;color:var(--green-b)}
.back-link{
  display:flex;align-items:center;gap:.5rem;font-size:.77rem;color:var(--muted);
  padding:.38rem .7rem;border-radius:var(--rs);cursor:pointer;text-decoration:none;
  transition:color var(--t),background var(--t);
}
.back-link:hover{color:var(--text);background:var(--bg3)}
.back-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* ─── MAIN ─── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg0)}

/* ─── VIEW HEADER ─── */
.view-hd{
  display:flex;align-items:center;gap:.9rem;padding:.75rem 1.4rem;
  border-bottom:1px solid var(--border);background:var(--bg1);flex-shrink:0;min-height:var(--topbar);
}
.view-title{font-size:1rem;font-weight:700;color:var(--text)}
.view-sub{font-size:.76rem;color:var(--dim);margin-left:.1rem}
.view-acts{margin-left:auto;display:flex;align-items:center;gap:.6rem}
.rt-dot{width:7px;height:7px;border-radius:50%;background:var(--green-b);animation:pulse 2s infinite}
.rt-dot.off{background:var(--red);animation:none}

/* ─── BUTTONS ─── */
.btn{
  display:inline-flex;align-items:center;gap:.42rem;
  padding:.48rem .88rem;border-radius:var(--rs);
  font-size:.8rem;font-weight:600;cursor:pointer;border:none;
  transition:all var(--t);font-family:inherit;white-space:nowrap;
}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:#25753e}
.btn-ghost{background:var(--bg3);color:var(--muted)}
.btn-ghost:hover{background:var(--bg4);color:var(--text)}
.btn-danger{background:var(--red-s);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:.33rem .65rem;font-size:.74rem}

/* ─── SCROLLABLE VIEW ─── */
.view-body{
  flex:1;overflow-y:auto;padding:1.4rem;
  scrollbar-width:thin;scrollbar-color:var(--border-b) transparent;
}
.view-body::-webkit-scrollbar{width:4px}
.view-body::-webkit-scrollbar-thumb{background:var(--border-b);border-radius:4px}

/* ─── OVERVIEW STATS ─── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
.stat-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.35rem;
}
.stat-card.hl{border-color:rgba(74,222,128,.2);background:var(--green-s2)}
.stat-card.urg{border-color:rgba(196,82,82,.22);background:rgba(196,82,82,.04)}
.stat-lbl{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat-val{font-size:1.85rem;font-weight:800;color:var(--text);line-height:1}
.stat-sub{font-size:.7rem;color:var(--dim)}

/* ─── SECTION HEAD ─── */
.sec-head{display:flex;align-items:center;gap:.55rem;margin-bottom:.8rem}
.sec-head h3{font-size:.82rem;font-weight:700;color:var(--text)}
.sec-cnt{background:var(--bg3);color:var(--muted);font-size:.67rem;font-weight:700;padding:2px 7px;border-radius:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}

/* ─── ALERT STRIP ─── */
.alert-strip{
  background:rgba(196,82,82,.08);border:1px solid rgba(196,82,82,.2);
  border-radius:var(--rs);padding:.6rem .85rem;
  display:flex;align-items:center;gap:.65rem;font-size:.78rem;color:var(--red);
  margin-bottom:.45rem;cursor:pointer;transition:background var(--t);
}
.alert-strip:hover{background:rgba(196,82,82,.14)}
.alert-strip svg{width:15px;height:15px;stroke:var(--red);fill:none;stroke-width:2;flex-shrink:0}

/* ─── KANBAN ─── */
.kanban{
  display:flex;gap:1rem;overflow-x:auto;padding-bottom:1rem;
  scrollbar-width:thin;scrollbar-color:var(--border-b) transparent;
  height:100%;align-items:flex-start;
}
.kanban::-webkit-scrollbar{height:4px}
.kanban::-webkit-scrollbar-thumb{background:var(--border-b);border-radius:4px}
.k-col{
  min-width:268px;max-width:268px;background:var(--bg1);
  border:1px solid var(--border);border-radius:var(--r);
  display:flex;flex-direction:column;max-height:calc(100vh - 130px);flex-shrink:0;
}
.k-col-hd{
  padding:.72rem .9rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.48rem;flex-shrink:0;
}
.k-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.k-col-title{font-size:.78rem;font-weight:700;color:var(--text)}
.k-cnt{margin-left:auto;background:var(--bg3);color:var(--muted);font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:8px}
.k-cards{flex:1;overflow-y:auto;padding:.55rem;display:flex;flex-direction:column;gap:.45rem;scrollbar-width:thin;scrollbar-color:var(--border-b) transparent}
.k-add{padding:.55rem;flex-shrink:0;border-top:1px solid var(--border)}
.k-add-btn{
  width:100%;background:transparent;border:1px dashed var(--border-b);
  color:var(--dim);font-size:.75rem;padding:.45rem;border-radius:var(--rs);
  cursor:pointer;font-family:inherit;transition:all var(--t);
  display:flex;align-items:center;justify-content:center;gap:.38rem;
}
.k-add-btn:hover{background:var(--bg3);color:var(--muted);border-color:var(--green)}

/* ─── TASK CARD ─── */
.task-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);
  padding:.72rem .82rem;cursor:pointer;transition:all var(--t);
  display:flex;flex-direction:column;gap:.42rem;
}
.task-card:hover{border-color:var(--border-b);background:var(--bg3);transform:translateY(-1px);box-shadow:var(--shadow-s)}
.task-title{font-size:.8rem;font-weight:600;color:var(--text);line-height:1.35}
.task-meta{display:flex;align-items:center;gap:.38rem;flex-wrap:wrap}
.task-acts{display:flex;gap:.28rem;margin-top:.2rem;flex-wrap:wrap;opacity:0;transition:opacity var(--t)}
.task-card:hover .task-acts{opacity:1}
.move-btn{
  font-size:.66rem;padding:.22rem .48rem;border-radius:4px;
  background:var(--bg4);color:var(--muted);border:none;cursor:pointer;
  font-family:inherit;font-weight:500;transition:all var(--t);
}
.move-btn:hover{background:var(--green-s);color:var(--green-b)}

/* ─── CHIPS ─── */
.chip{display:inline-flex;align-items:center;gap:.28rem;padding:2px 7px;border-radius:10px;font-size:.65rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.ch-critical{background:var(--red-s);color:var(--red)}
.ch-high{background:var(--orange-s);color:var(--orange)}
.ch-normal{background:var(--blue-s);color:var(--blue)}
.ch-low{background:var(--bg3);color:var(--dim)}
.ch-idea{background:var(--purple-s);color:var(--purple)}
.ch-bug{background:var(--red-s);color:var(--red)}
.ch-pending{background:var(--yellow-s);color:var(--yellow)}
.ch-feedback{background:var(--blue-s);color:var(--blue)}
.ch-decision{background:var(--green-s);color:var(--green-b)}
.ch-review{background:var(--orange-s);color:var(--orange)}
.ch-todo{background:var(--bg3);color:var(--muted)}
.ch-in_progress{background:var(--blue-s);color:var(--blue)}
.ch-done{background:var(--green-s);color:var(--green-b)}
.ch-urgent{background:var(--red-s);color:var(--red)}
.ch-blocked{background:var(--orange-s);color:var(--orange)}

/* ─── ASSIGNEE ─── */
.av-chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.67rem;color:var(--muted)}
.av-dot{width:15px;height:15px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:.52rem;font-weight:700;color:#fff;flex-shrink:0}

/* ─── DUE DATE ─── */
.due-chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.65rem;color:var(--dim)}
.due-chip svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2}
.due-chip.late{color:var(--red)}

/* ─── NOTES ─── */
.notes-filters{display:flex;gap:.45rem;margin-bottom:1rem;flex-wrap:wrap}
.fchip{
  padding:.32rem .78rem;border-radius:20px;font-size:.73rem;font-weight:600;
  cursor:pointer;background:var(--bg2);color:var(--muted);
  border:1px solid var(--border);transition:all var(--t);
}
.fchip.on{background:var(--green-s);color:var(--green-b);border-color:var(--green)}
.fchip:hover:not(.on){background:var(--bg3);color:var(--text)}

.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:1rem}
.note-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:.95rem 1rem;display:flex;flex-direction:column;gap:.55rem;
  transition:all var(--t);position:relative;cursor:pointer;
}
.note-card:hover{border-color:var(--border-b);transform:translateY(-2px);box-shadow:var(--shadow-s)}
.note-card.pinned{border-top:2px solid var(--yellow)}
.note-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.4rem}
.note-title{font-size:.86rem;font-weight:700;color:var(--text);line-height:1.3}
.note-body{font-size:.76rem;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.note-author{font-size:.66rem;color:var(--dim)}
.note-date{font-size:.66rem;color:var(--dim)}
.note-acts{display:flex;gap:.28rem;opacity:0;transition:opacity var(--t);position:absolute;top:.55rem;right:.55rem}
.note-card:hover .note-acts{opacity:1}
.note-act-btn{
  width:25px;height:25px;border-radius:4px;background:var(--bg3);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t);
}
.note-act-btn:hover{background:var(--bg4)}
.note-act-btn svg{width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2}

/* ─── ACTIVITY ─── */
.act-feed{display:flex;flex-direction:column;gap:.25rem;max-width:620px}
.act-item{display:flex;gap:.85rem;padding:.6rem .55rem;border-radius:var(--rs);transition:background var(--t)}
.act-item:hover{background:var(--bg2)}
.act-av{
  width:31px;height:31px;border-radius:50%;background:var(--green);
  display:flex;align-items:center;justify-content:center;
  font-size:.77rem;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px;
}
.act-text{font-size:.8rem;color:var(--text);line-height:1.4}
.act-text strong{color:var(--green-b);font-weight:600}
.act-entity{font-style:italic;color:var(--muted)}
.act-time{font-size:.68rem;color:var(--dim);margin-top:.13rem}

/* ─── ROADMAP ─── */
.rm-section{margin-bottom:1.8rem}
.rm-head{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.7rem;display:flex;align-items:center;gap:.6rem}
.rm-head::after{content:'';flex:1;height:1px;background:var(--border)}
.rm-items{display:flex;flex-direction:column;gap:.45rem}
.rm-item{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);
  padding:.62rem .9rem;display:flex;align-items:center;gap:.75rem;
  transition:all var(--t);cursor:pointer;
}
.rm-item:hover{border-color:var(--border-b);background:var(--bg3)}
.rm-icon{width:27px;height:27px;border-radius:6px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.82rem}
.rm-title{font-size:.81rem;font-weight:600;color:var(--text);flex:1}
.rm-meta{display:flex;align-items:center;gap:.45rem}

/* ─── MODALS ─── */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);
  z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal.open{opacity:1;pointer-events:all}
.modal-box{
  background:var(--bg2);border:1px solid var(--border-b);border-radius:calc(var(--r) + 2px);
  padding:1.7rem;width:100%;max-width:510px;max-height:90vh;overflow-y:auto;
  transform:translateY(18px);transition:transform .2s;
}
.modal.open .modal-box{transform:translateY(0)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.4rem}
.modal-title{font-size:1rem;font-weight:700;color:var(--text)}
.modal-close{
  background:var(--bg3);border:none;width:27px;height:27px;border-radius:6px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--t);
}
.modal-close:hover{background:var(--bg4)}
.modal-close svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2.5}

/* ─── FORMS ─── */
.fg{margin-bottom:1rem}
label{display:block;font-size:.73rem;font-weight:600;color:var(--muted);margin-bottom:.35rem}
input,textarea,select{
  width:100%;background:var(--bg1);border:1px solid var(--border-b);border-radius:var(--rs);
  padding:.55rem .78rem;color:var(--text);font-size:.83rem;font-family:inherit;
  transition:border-color var(--t);outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--green)}
textarea{resize:vertical;min-height:76px}
select option{background:var(--bg1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.form-acts{display:flex;gap:.55rem;justify-content:flex-end;margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--border)}

/* ─── DETAIL PANEL ─── */
.detail-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  z-index:1001;display:flex;justify-content:flex-end;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.detail-overlay.open{opacity:1;pointer-events:all}
.detail-panel{
  width:410px;max-width:95vw;background:var(--bg2);border-left:1px solid var(--border-b);
  height:100%;overflow-y:auto;padding:1.4rem;
  transform:translateX(28px);transition:transform .23s;
  scrollbar-width:thin;scrollbar-color:var(--border-b) transparent;
}
.detail-overlay.open .detail-panel{transform:translateX(0)}
.detail-title{font-size:1.08rem;font-weight:700;color:var(--text);line-height:1.35;margin-bottom:1rem}
.detail-meta{display:flex;flex-wrap:wrap;gap:.55rem;margin-bottom:.9rem}
.dsec{margin-top:1.1rem}
.dsec>label{display:block;font-size:.69rem;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem}
.dbody{font-size:.8rem;color:var(--muted);line-height:1.6;white-space:pre-wrap;background:var(--bg1);padding:.7rem .85rem;border-radius:var(--rs);border:1px solid var(--border)}
.status-row{display:flex;gap:.38rem;flex-wrap:wrap;margin-top:.45rem}
.stat-opt{
  padding:.3rem .7rem;border-radius:20px;font-size:.72rem;font-weight:600;
  cursor:pointer;border:1.5px solid transparent;transition:all var(--t);background:var(--bg3);color:var(--muted);
}
.stat-opt:hover{color:var(--text);background:var(--bg4)}
.stat-opt.cur{border-color:currentColor}

/* ─── CHECKLIST ─── */
.checklist{display:flex;flex-direction:column;gap:.38rem;margin-top:.4rem}
.cl-item{display:flex;align-items:center;gap:.48rem;font-size:.78rem;color:var(--muted)}
.cl-item input[type=checkbox]{width:13px;height:13px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
.cl-item.done{text-decoration:line-through;opacity:.5}

/* ─── TOAST ─── */
#toasts{position:fixed;bottom:1.4rem;right:1.4rem;display:flex;flex-direction:column;gap:.42rem;z-index:9998;pointer-events:none}
.toast{
  background:var(--bg3);border:1px solid var(--border-b);border-radius:var(--rs);
  padding:.6rem .95rem;font-size:.78rem;color:var(--text);box-shadow:var(--shadow);
  animation:slideIn .22s ease;pointer-events:all;max-width:290px;line-height:1.4;
}
.toast.err{border-color:var(--red);background:rgba(196,82,82,.1);color:var(--red)}
.toast.ok{border-color:var(--green);background:var(--green-s2)}

/* ─── EMPTY STATE ─── */
.empty{display:flex;flex-direction:column;align-items:center;gap:.65rem;padding:2.8rem;color:var(--dim);text-align:center}
.empty svg{width:34px;height:34px;stroke:var(--dim);fill:none;opacity:.45;stroke-width:1.5}
.empty p{font-size:.8rem}

/* ─── NOTIFICATIONS ─── */
.bell-wrap{position:relative}
.bell-btn{
  position:relative;width:34px;height:34px;border-radius:var(--rs);
  background:var(--bg3);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background var(--t);
}
.bell-btn:hover{background:var(--bg4)}
.bell-btn svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.bell-btn.has-unread svg{stroke:var(--green-b)}
.bell-badge{
  position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;
  background:var(--red);color:#fff;font-size:.6rem;font-weight:700;border-radius:9px;
  display:none;align-items:center;justify-content:center;line-height:1;
}
.bell-badge.show{display:flex}
.notif-panel{
  position:absolute;top:42px;right:0;width:340px;max-width:92vw;max-height:440px;
  background:var(--bg2);border:1px solid var(--border-b);border-radius:var(--r);
  box-shadow:var(--shadow);z-index:1002;overflow:hidden;display:none;flex-direction:column;
}
.notif-panel.open{display:flex;animation:fadeUp .18s ease}
.notif-hd{display:flex;align-items:center;justify-content:space-between;padding:.7rem .9rem;border-bottom:1px solid var(--border)}
.notif-hd strong{font-size:.84rem;color:var(--text)}
.notif-hd button{background:none;border:none;color:var(--green-b);font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit}
.notif-list{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border-b) transparent}
.notif-item{display:flex;gap:.65rem;padding:.65rem .9rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--t)}
.notif-item:hover{background:var(--bg3)}
.notif-item.unread{background:var(--green-s2)}
.notif-av{width:30px;height:30px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:700;color:#fff;flex-shrink:0}
.notif-body-txt{flex:1;min-width:0}
.notif-title{font-size:.78rem;color:var(--text);font-weight:600;line-height:1.3}
.notif-sub{font-size:.72rem;color:var(--muted);margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif-time{font-size:.64rem;color:var(--dim);margin-top:.2rem}
.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--green-b);flex-shrink:0;margin-top:.4rem}
.notif-empty{padding:1.8rem 1rem;text-align:center;color:var(--dim);font-size:.78rem}

/* ─── ANIMATIONS ─── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.8)}}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .22s ease}

/* ─── RESPONSIVE ─── */
@media(max-width:820px){
  :root{--sidebar:58px}
  .sb-brand,.nav-item span,.admin-name,.admin-role,.back-link span,.nav-label{display:none}
  .sb-head{padding:.75rem;justify-content:center}
  .nav-item{padding:.58rem;justify-content:center;margin:0 .18rem}
  .nav-item svg{width:19px;height:19px}
  .admin-card{padding:.45rem;justify-content:center}
  .admin-name,.admin-role{display:none}
  .stats-row{grid-template-columns:1fr 1fr}
  .grid-2{grid-template-columns:1fr}
  .kanban{flex-direction:column}
  .k-col{min-width:unset;max-width:unset;width:100%}
  .notes-grid{grid-template-columns:1fr}
  .detail-panel{width:100%}
}
</style>
</head>

  </aside>

  <!-- MAIN -->
  <main id="main">

    <!-- VIEW HEADER -->
    <div class="view-hd">
      <span class="view-title" id="vTitle">Overview</span>

      <div class="view-acts">
        <div class="bell-wrap">
          <button class="bell-btn" id="bellBtn" onclick="toggleNotifPanel(event)" title="Notificaciones">
            <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
            <span class="bell-badge" id="bellBadge">0</span>

          <div class="notif-panel" id="notifPanel">

    <!-- OVERVIEW -->

<!-- TASK MODAL -->
<div class="modal" id="taskModal">

<script>
// ══════════════════════════════════════════
// CONFIG — pega aquí tus credenciales de Supabase
// Están en index.html buscando: window.BIOMASTER_CONFIG
// ══════════════════════════════════════════
const SUPABASE_URL = 'https://jicgsudngjvmbdoqaklr.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_iHalFH56MKADGgMNHD3vPg_xwA6nBMu'

// ─── INIT ───
const { createClient } = supabase
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

let profile = null
let tasks = [], notes = [], activity = [], notifications = [], admins = []
let currentView = 'overview'
let noteFilter = 'all'
let editTaskId = null, editNoteId = null

const COLS = [
  { status:'todo',        label:'Por Hacer',   color:'#6fa07a' },
  { status:'in_progress', label:'En Progreso',  color:'#2b6ea3' },
  { status:'urgent',      label:'Urgente',      color:'#c45252' },
  { status:'blocked',     label:'Bloqueada',    color:'#c46a2f' },
  { status:'done',        label:'Hecho',        color:'#2f8b4d' },
]
const PRIO = { critical:['ch-critical','🔴 Crítica'], high:['ch-high','🟠 Alta'], normal:['ch-normal','🔵 Normal'], low:['ch-low','⚫ Baja'] }
const NOTE_TYPES = [
  {k:'all',  l:'Todas'},
  {k:'idea', l:'💡 Idea'},
  {k:'bug',  l:'🐛 Bug'},
  {k:'pending',  l:'⏳ Pendiente'},
  {k:'feedback', l:'💬 Feedback'},
  {k:'decision', l:'✅ Decisión'},
  {k:'review',   l:'👁 Revisión'},
]
const CAT_ICON = {feature:'🧩',bug:'🐛',content:'📚',ops:'⚙️',general:'📌'}
const VIEW_CFG = {
  overview:  {title:'Overview',    sub:'Centro de operaciones BioMaster', action:null},
  tasks:     {title:'Tareas',      sub:'Tablero Kanban',                   action:'Nueva Tarea'},
  notes:     {title:'Notas',       sub:'Notas internas del equipo',        action:'Nueva Nota'},
  activity:  {title:'Actividad',   sub:'Historial en tiempo real',         action:null},
  roadmap:   {title:'Roadmap',     sub:'Planificación del proyecto',        action:'Nueva Tarea'},
}

// ─── AUTH ───
async function init() {
  try {
    const { data:{ session } } = await sb.auth.getSession()
    if (!session) return deny()

    const { data:p, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single()
    if (error || !p || p.role !== 'admin') return deny()

    profile = p
    document.getElementById('sbAv').textContent = (p.name||'A').charAt(0).toUpperCase()
    document.getElementById('sbName').textContent = p.name || 'Admin'

    await Promise.all([loadTasks(), loadNotes(), loadActivity(), loadNotifications(), loadAdmins()])
    initNav()
    populateAssigneeSelect()
    renderView('overview')
    renderNotifBadge()
    showApp()
    initRealtime()
  } catch(e) {
    console.error(e)
    deny()
  }
}

function deny() {
  document.getElementById('loadMsg').textContent = 'Acceso denegado. Redirigiendo...'
  setTimeout(() => { window.location.href = '/' }, 1800)
}

function showApp() {
  const ls = document.getElementById('loadScreen')
  ls.classList.add('out')
  setTimeout(() => { ls.remove(); document.getElementById('wsApp').classList.add('show') }, 280)
}

// ─── DATA ───
async function loadTasks() {
  const { data } = await sb.from('workspace_tasks').select('*').order('created_at', {ascending:false})
  tasks = data || []
}
async function loadNotes() {
  const { data } = await sb.from('workspace_notes').select('*')
    .order('pinned', {ascending:false}).order('created_at', {ascending:false})
  notes = data || []
}
async function loadActivity() {
  const { data } = await sb.from('workspace_activity').select('*').order('created_at', {ascending:false}).limit(80)
  activity = data || []
}
async function loadNotifications() {
  const { data } = await sb.from('workspace_notifications').select('*')
    .eq('recipient_id', profile.id).order('created_at', {ascending:false}).limit(40)
  notifications = data || []
}
async function loadAdmins() {
  const { data } = await sb.from('profiles').select('id, name').eq('role', 'admin').order('name')
  admins = (data || []).filter(a => a.name)
}
function populateAssigneeSelect() {
  const sel = document.getElementById('assigneeSelect')
  if (!sel) return
  sel.innerHTML = '<option value="">Sin asignar</option>' +
    admins.map(a => `<option value="${esc(a.name)}">${esc(a.name)}</option>`).join('')
}
// Conserva un responsable heredado (texto libre) que no esté en la lista de admins
function ensureAssigneeOption(name) {
  const sel = document.getElementById('assigneeSelect')
  if (!sel || !name) return
  if (![...sel.options].some(o => o.value === name)) {
    const o = document.createElement('option')
    o.value = name; o.textContent = name + ' (heredado)'
    sel.appendChild(o)
  }
}

// ─── NOTIFICATIONS UI ───
function unreadNotifCount() { return notifications.filter(n => !n.read).length }

function renderNotifBadge() {
  const n = unreadNotifCount()
  const badge = document.getElementById('bellBadge')
  const btn = document.getElementById('bellBtn')
  if (!badge || !btn) return
  badge.textContent = n > 9 ? '9+' : String(n)
  badge.classList.toggle('show', n > 0)
  btn.classList.toggle('has-unread', n > 0)
}

function renderNotifList() {
  const list = document.getElementById('notifList')
  if (!list) return
  if (!notifications.length) {
    list.innerHTML = '<div class="notif-empty">Sin notificaciones todavía</div>'
    return
  }
  list.innerHTML = notifications.map(n => {
    const init = (n.actor_name || 'A').charAt(0).toUpperCase()
    return `
      <div class="notif-item ${n.read ? '' : 'unread'}" onclick="onNotifClick('${n.id}','${n.entity_type||''}','${n.entity_id||''}')">
        <div class="notif-av">${init}</div>
        <div class="notif-body-txt">
          <div class="notif-title">${esc(n.title)}</div>
          ${n.body ? `<div class="notif-sub">${esc(n.body)}</div>` : ''}
          <div class="notif-time">${timeAgo(n.created_at)}</div>
        </div>
        ${n.read ? '' : '<div class="notif-dot"></div>'}
      </div>`
  }).join('')
}

function toggleNotifPanel(e) {
  if (e) e.stopPropagation()
  const p = document.getElementById('notifPanel')
  const opening = !p.classList.contains('open')
  p.classList.toggle('open', opening)
  if (opening) renderNotifList()
}

async function onNotifClick(id, etype, eid) {
  await markNotifRead(id)
  document.getElementById('notifPanel').classList.remove('open')
  if (etype === 'task' && eid && tasks.find(x => x.id === eid)) openDetail(eid)
}

async function markNotifRead(id) {
  const n = notifications.find(x => x.id === id)
  if (!n || n.read) return
  n.read = true; renderNotifBadge(); renderNotifList()
  await sb.from('workspace_notifications').update({ read: true }).eq('id', id)
}

async function markAllNotifsRead() {
  const unread = notifications.filter(n => !n.read)
  if (!unread.length) return
  unread.forEach(n => n.read = true)
  renderNotifBadge(); renderNotifList()
  await sb.from('workspace_notifications').update({ read: true }).eq('recipient_id', profile.id).eq('read', false)
}

// ─── NAV ───
function initNav() {
  document.querySelectorAll('.nav-item[data-view]').forEach(el => {
    el.addEventListener('click', () => renderView(el.dataset.view))
  })
}

function renderView(name) {
  currentView = name
  document.querySelectorAll('.nav-item[data-view]').forEach(el => el.classList.toggle('active', el.dataset.view === name))
  document.querySelectorAll('[id^="view-"]').forEach(el => el.hidden = true)
  const vEl = document.getElementById('view-' + name)
  if (vEl) vEl.hidden = false

  const cfg = VIEW_CFG[name] || {}
  document.getElementById('vTitle').textContent = cfg.title || name
  document.getElementById('vSub').textContent = cfg.sub || ''
  const mb = document.getElementById('mainBtn')
  mb.hidden = !cfg.action
  if (cfg.action) document.getElementById('mainBtnLbl').textContent = cfg.action

  renderCurrent()
}

function renderCurrent() {
  if (currentView === 'overview') renderOverview()
  else if (currentView === 'tasks') renderKanban()
  else if (currentView === 'notes') renderNotes()
  else if (currentView === 'activity') renderActivity()
  else if (currentView === 'roadmap') renderRoadmap()
}

// ─── OVERVIEW ───
function renderOverview() {
  const urg  = tasks.filter(t => t.status === 'urgent' || t.status === 'blocked')
  const inPr = tasks.filter(t => t.status === 'in_progress')
  const done = tasks.filter(t => t.status === 'done')
  const today = new Date().toISOString().slice(0,10)
  const doneToday = done.filter(t => (t.updated_at||'').slice(0,10) === today)

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card hl">
      <div class="stat-lbl">Total Tareas</div>
      <div class="stat-val">${tasks.length}</div>
      <div class="stat-sub">${inPr.length} en progreso</div>
    </div>
    <div class="stat-card urg">
      <div class="stat-lbl">Urgentes / Bloqueadas</div>
      <div class="stat-val">${urg.length}</div>
      <div class="stat-sub">requieren atención</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Completadas Hoy</div>
      <div class="stat-val">${doneToday.length}</div>
      <div class="stat-sub">de ${done.length} totales</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Notas Activas</div>
      <div class="stat-val">${notes.length}</div>
      <div class="stat-sub">${notes.filter(n=>n.pinned).length} fijadas</div>
    </div>`

  document.getElementById('urgList').innerHTML = urg.length
    ? urg.map(t => `
      <div class="alert-strip" onclick="openDetail('${t.id}')">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span style="flex:1">${esc(t.title)}</span>
        <span class="chip ${t.status==='blocked'?'ch-blocked':'ch-urgent'}">${t.status==='blocked'?'BLOQUEADA':'URGENTE'}</span>
      </div>`).join('')
    : '<p style="font-size:.78rem;color:var(--dim)">Sin tareas urgentes ✓</p>'

  document.getElementById('recentAct').innerHTML = activity.slice(0,6).map(actHtml).join('')
    || '<p style="font-size:.78rem;color:var(--dim)">Sin actividad aún</p>'

  setBadge(urg.length)
}

// ─── KANBAN ───
function renderKanban() {
  document.getElementById('kanban').innerHTML = COLS.map(col => {
    const ct = tasks.filter(t => t.status === col.status)
    return `
      <div class="k-col">
        <div class="k-col-hd">
          <div class="k-dot" style="background:${col.color}"></div>
          <span class="k-col-title">${col.label}</span>
          <span class="k-cnt">${ct.length}</span>
        </div>
        <div class="k-cards">
          ${ct.map(t => taskCardHtml(t)).join('') || '<div style="padding:.4rem .3rem;font-size:.73rem;color:var(--dim);text-align:center">Vacío</div>'}
        </div>
        <div class="k-add">
          <button class="k-add-btn" onclick="openNewTask('${col.status}')">
            <svg width="11" height="11" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nueva tarea
          </button>
        </div>
      </div>`
  }).join('')
}

function taskCardHtml(t) {
  const [pc, pl] = PRIO[t.priority] || PRIO.normal
  const moves = COLS.filter(c => c.status !== t.status)
    .map(c => `<button class="move-btn" onclick="moveTask(event,'${t.id}','${c.status}')">→ ${c.label}</button>`).join('')
  const av = t.assignee_name ? `<span class="av-chip"><span class="av-dot">${t.assignee_name.charAt(0).toUpperCase()}</span>${esc(t.assignee_name)}</span>` : ''
  const due = t.due_date ? `<span class="due-chip ${new Date(t.due_date)<new Date()&&t.status!=='done'?'late':''}"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="10" x2="21" y2="10" stroke-width="2" stroke-linecap="round"/></svg>${t.due_date}</span>` : ''
  return `
    <div class="task-card" onclick="openDetail('${t.id}')">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta">
        <span class="chip ${pc}">${pl}</span>${av}${due}
      </div>
      <div class="task-acts">${moves}</div>
    </div>`
}

// ─── NOTES ───
function renderNotes() {
  document.getElementById('noteFilters').innerHTML = NOTE_TYPES.map(t =>
    `<span class="fchip ${noteFilter===t.k?'on':''}" onclick="setNoteFilter('${t.k}')">${t.l}</span>`
  ).join('')

  const filtered = noteFilter === 'all' ? notes : notes.filter(n => n.type === noteFilter)
  const pinned = filtered.filter(n => n.pinned)
  const rest   = filtered.filter(n => !n.pinned)

  document.getElementById('notesGrid').innerHTML = [...pinned,...rest].map(n => noteCardHtml(n)).join('')
    || `<div class="empty" style="grid-column:1/-1"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M5 8h14M7 20h10a2 2 0 002-2V8M5 8a2 2 0 01-2-2V4h18v2a2 2 0 01-2 2"/></svg><p>No hay notas</p></div>`
}

function noteCardHtml(n) {
  const types = {idea:['ch-idea','💡 Idea'],bug:['ch-bug','🐛 Bug'],pending:['ch-pending','⏳ Pendiente'],feedback:['ch-feedback','💬 Feedback'],decision:['ch-decision','✅ Decisión'],review:['ch-review','👁 Revisión']}
  const [tc, tl] = types[n.type] || ['ch-normal', n.type]
  const date = new Date(n.created_at).toLocaleDateString('es-CR', {day:'numeric',month:'short'})
  return `
    <div class="note-card ${n.pinned?'pinned':''}" onclick="openEditNote('${n.id}')">
      <div class="note-card-top">
        <span class="chip ${tc}">${tl}</span>
        ${n.pinned ? '<span style="font-size:.73rem;color:var(--yellow)">📌</span>' : ''}
      </div>
      <div class="note-acts">
        <button class="note-act-btn" title="Editar" onclick="event.stopPropagation();openEditNote('${n.id}')">
          <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        </button>
        <button class="note-act-btn" title="${n.pinned?'Desfijar':'Fijar'}" onclick="event.stopPropagation();togglePin('${n.id}',${!n.pinned})">
          <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
        </button>
        <button class="note-act-btn" title="Eliminar" onclick="event.stopPropagation();deleteNote('${n.id}')">
          <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>
      </div>
      <div class="note-title">${esc(n.title)}</div>
      ${n.content ? `<div class="note-body">${esc(n.content)}</div>` : ''}
      <div class="note-foot">
        <span class="note-author">${esc(n.created_by_name||'Admin')}</span>
        <span class="note-date">${date}</span>
      </div>
    </div>`
}

// ─── ACTIVITY ───
function renderActivity() {

// ─── ROADMAP ───
function renderRoadmap() {
  const groups = [
    {k:'in_progress',label:'🚀 En Progreso'},
    {k:'urgent',     label:'⚡ Urgente'},
    {k:'todo',       label:'📋 Por Hacer'},
    {k:'blocked',    label:'🚫 Bloqueado'},
    {k:'done',       label:'✅ Completado'},
  ]
  document.getElementById('rmContent').innerHTML = groups.map(g => {
    const gt = tasks.filter(t => t.status === g.k)
    if (!gt.length) return ''
    return `
      <div class="rm-section">
        <div class="rm-head">${g.label}</div>
        <div class="rm-items">
          ${gt.map(t => {
            const [pc,pl] = PRIO[t.priority]||PRIO.normal
            const av = t.assignee_name ? `<span class="av-chip"><span class="av-dot">${t.assignee_name.charAt(0).toUpperCase()}</span>${esc(t.assignee_name)}</span>` : ''
            return `
              <div class="rm-item" onclick="openDetail('${t.id}')">
                <div class="rm-icon">${CAT_ICON[t.category]||'📌'}</div>
                <div class="rm-title">${esc(t.title)}</div>
                <div class="rm-meta">${av}<span class="chip ${pc}">${pl}</span></div>
              </div>`
          }).join('')}
        </div>
      </div>`
  }).join('') || `<div class="empty"><p>No hay tareas todavía</p></div>`
}

// ─── TASK CRUD ───
async function submitTask(e) {
  e.preventDefault()
  const f = e.target
  const clRaw = (f.checklist.value||'').split('\n').map(s=>s.trim()).filter(Boolean)
  const payload = {
    title: f.title.value.trim(),
    description: f.description.value.trim() || null,
    checklist: clRaw.map(text=>({text,done:false})),
    status: f.status.value,
    priority: f.priority.value,
    category: f.category.value,
    assignee_name: f.assignee_name.value.trim() || null,
    due_date: f.due_date.value || null,
    created_by: profile.id,
    created_by_name: profile.name,
    updated_at: new Date().toISOString()
  }
  if (!payload.title) return toast('El título es requerido', true)

  const btn = document.getElementById('taskSubmitBtn')
  btn.disabled = true; btn.textContent = 'Guardando...'

  let err
  if (editTaskId) {
    ;({ error:err } = await sb.from('workspace_tasks').update(payload).eq('id', editTaskId))
    if (!err) { await log('actualizó la tarea', 'task', payload.title); toast('Tarea actualizada') }
  } else {
    ;({ error:err } = await sb.from('workspace_tasks').insert(payload))
    if (!err) { await log('creó una nueva tarea', 'task', payload.title); toast('Tarea creada ✓') }
  }

  btn.disabled = false; btn.textContent = editTaskId ? 'Guardar Cambios' : 'Crear Tarea'
  if (err) return toast('Error: ' + err.message, true)
  closeModal('taskModal')
  await loadTasks(); renderCurrent()
}

async function moveTask(e, id, status) {
  e.stopPropagation()
  const t = tasks.find(x => x.id === id)
  if (!t) return
  const lbl = COLS.find(c => c.status === status)?.label || status
  const acts = {done:'completó la tarea',urgent:'marcó como urgente',blocked:'marcó como bloqueada',in_progress:'inició la tarea',todo:'movió la tarea a Por Hacer'}
  const { error } = await sb.from('workspace_tasks').update({status, updated_at:new Date().toISOString()}).eq('id', id)
  if (error) return toast('Error: ' + error.message, true)
  await log(acts[status]||`movió a ${lbl}`, 'task', t.title)
  toast(`→ ${lbl}`)
  await loadTasks(); await loadActivity(); renderCurrent()
}

async function deleteTask(id) {
  const t = tasks.find(x => x.id === id)
  if (!confirm(`¿Eliminar la tarea "${t?.title}"?`)) return
  await sb.from('workspace_tasks').delete().eq('id', id)
  await log('eliminó la tarea', 'task', t?.title)
  toast('Tarea eliminada')
  closeDetailPanel()
  await loadTasks(); renderCurrent()
}

async function toggleChecklistItem(taskId, idx, done) {
  const t = tasks.find(x => x.id === taskId)
  if (!t) return
  const cl = [...(t.checklist||[])]
  cl[idx] = {...cl[idx], done}
  await sb.from('workspace_tasks').update({checklist:cl, updated_at:new Date().toISOString()}).eq('id', taskId)
  t.checklist = cl
  openDetail(taskId)
}

  const f = e.target
  const payload = {

    content: f.content.value.trim() || null,
    type: f.type.value,
    created_by: profile.id,
    created_by_name: profile.name,

  }
  if (!payload.title) return toast('El título es requerido', true)

  const btn = document.getElementById('noteSubmitBtn')
  btn.disabled = true; btn.textContent = 'Guardando...'

  let err
  if (editNoteId) {
    ;({ error:err } = await sb.from('workspace_notes').update(payload).eq('id', editNoteId))
    if (!err) { await log('actualizó la nota', 'note', payload.title); toast('Nota actualizada') }
  } else {
    ;({ error:err } = await sb.from('workspace_notes').insert(payload))
    if (!err) { await log('agregó una nota', 'note', payload.title); toast('Nota guardada ✓') }

async function togglePin(id, pinned) {
  await sb.from('workspace_notes').update({pinned}).eq('id', id)
  await loadNotes(); renderNotes()
}

async function deleteNote(id) {
  const n = notes.find(x => x.id === id)
  if (!confirm(`¿Eliminar la nota "${n?.title}"?`)) return
  await sb.from('workspace_notes').delete().eq('id', id)
  await log('eliminó la nota', 'note', n?.title)
  toast('Nota eliminada')
  await loadNotes(); renderNotes()
}

async function log(action, entityType, entityTitle) {
  await sb.from('workspace_activity').insert({

// ─── REALTIME ───
function initRealtime() {
  sb.channel('workspace-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'workspace_tasks'}, async () => {
      await loadTasks()
      renderCurrent()
      setBadge(tasks.filter(t => t.status==='urgent'||t.status==='blocked').length)
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'workspace_notes'}, async () => {
      await loadNotes()
      if (currentView === 'notes') renderNotes()
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'workspace_notifications', filter:`recipient_id=eq.${profile.id}`}, (payload) => {
      notifications.unshift(payload.new)
      renderNotifBadge()
      if (document.getElementById('notifPanel').classList.contains('open')) renderNotifList()
      toast(payload.new.title)
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'workspace_activity'}, async (payload) => {
      await loadActivity()
      if (currentView === 'activity') renderActivity()
      if (currentView === 'overview') {
        document.getElementById('recentAct').innerHTML = activity.slice(0,6).map(actHtml).join('')
      }
      const a = payload.new
      if (a?.actor_id !== profile.id) {
        toast(`${a.actor_name} ${a.action}${a.entity_title ? ` "${a.entity_title}"` : ''}`)
      }
    })
    .subscribe(s => {
      const d = document.getElementById('rtDot')
      if (d) d.classList.toggle('off', s !== 'SUBSCRIBED')
    })
}

// ─── MODAL HELPERS ───
function primaryAction() {
  if (currentView === 'notes') openNewNote()
  else openNewTask()
}

function openNewTask(status = 'todo') {
  editTaskId = null
  document.getElementById('taskModalTitle').textContent = 'Nueva Tarea'
  document.getElementById('taskSubmitBtn').textContent = 'Crear Tarea'
  const f = document.getElementById('taskForm'); f.reset(); f.status.value = status
  openModal('taskModal')
}

function openEditTask(id) {
  const t = tasks.find(x => x.id === id); if (!t) return
  editTaskId = id
  document.getElementById('taskModalTitle').textContent = 'Editar Tarea'
  document.getElementById('taskSubmitBtn').textContent = 'Guardar Cambios'
  const f = document.getElementById('taskForm')
  f.title.value = t.title||''; f.description.value = t.description||''
  f.checklist.value = (t.checklist||[]).map(c=>c.text).join('\n')
  f.status.value = t.status||'todo'; f.priority.value = t.priority||'normal'
  f.category.value = t.category||'general'
  ensureAssigneeOption(t.assignee_name); f.assignee_name.value = t.assignee_name||''
  f.due_date.value = t.due_date||''
  openModal('taskModal')
}

function openNewNote() {
  editNoteId = null
  document.getElementById('noteModalTitle').textContent = 'Nueva Nota'
  document.getElementById('noteSubmitBtn').textContent = 'Guardar Nota'
  document.getElementById('noteForm').reset()
  openModal('noteModal')
}

function openEditNote(id) {
  const n = notes.find(x => x.id === id); if (!n) return
  editNoteId = id
  document.getElementById('noteModalTitle').textContent = 'Editar Nota'
  document.getElementById('noteSubmitBtn').textContent = 'Guardar Cambios'
  const f = document.getElementById('noteForm')
  f.title.value = n.title||''; f.content.value = n.content||''; f.type.value = n.type||'idea'
  openModal('noteModal')
}

function openModal(id) { document.getElementById(id).classList.add('open') }
function closeModal(id) { document.getElementById(id).classList.remove('open') }

// ─── DETAIL PANEL ───
function openDetail(id) {
  const t = tasks.find(x => x.id === id); if (!t) return
  const [pc,pl] = PRIO[t.priority]||PRIO.normal
  const col = COLS.find(c => c.status === t.status)
  const date = new Date(t.created_at).toLocaleDateString('es-CR',{day:'numeric',month:'long',year:'numeric'})
  const av = t.assignee_name ? `<span class="av-chip"><span class="av-dot">${t.assignee_name.charAt(0).toUpperCase()}</span>${esc(t.assignee_name)}</span>` : ''
  const due = t.due_date ? `<span class="due-chip ${new Date(t.due_date)<new Date()&&t.status!=='done'?'late':''}"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="10" x2="21" y2="10" stroke-width="2" stroke-linecap="round"/></svg>${t.due_date}</span>` : ''

  const moveOpts = COLS.map(c => {
    const isCur = c.status === t.status
    return `<button class="stat-opt ${isCur?'cur':''}" style="${isCur?`color:${col.color}`:'`'}" onclick="moveFromDetail('${t.id}','${c.status}')" ${isCur?'disabled':''}>
      ${c.label}
    </button>`
  }).join('')

  const clHtml = (t.checklist||[]).length ? `
    <div class="dsec">
      <label>Checklist</label>
      <div class="checklist">
        ${(t.checklist||[]).map((item,i) => `
          <label class="cl-item ${item.done?'done':''}">
            <input type="checkbox" ${item.done?'checked':''} onchange="toggleChecklistItem('${t.id}',${i},this.checked)">
            ${esc(item.text)}
          </label>`).join('')}
      </div>
    </div>` : ''

  document.getElementById('detailPanel').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;margin-bottom:1rem">
      <span class="chip ${pc}">${pl}</span>
      <div style="display:flex;gap:.35rem;flex-shrink:0">
        <button class="btn btn-ghost btn-sm" onclick="openEditTask('${t.id}');closeDetailPanel()">Editar</button>
        <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">Eliminar</button>
        <button class="btn btn-ghost btn-sm" onclick="closeDetailPanel()">✕</button>
      </div>
    </div>
    <div class="detail-title">${esc(t.title)}</div>
    <div class="detail-meta">
      <span style="font-size:.76rem;color:var(--muted)">${CAT_ICON[t.category]||'📌'} ${t.category||'general'}</span>
      ${av}${due}
    </div>
    ${t.description ? `<div class="dsec"><label>Descripción</label><div class="dbody">${esc(t.description)}</div></div>` : ''}
    ${clHtml}
    <div class="dsec">
      <label>Mover a</label>
      <div class="status-row">${moveOpts}</div>
    </div>
    <div class="dsec">
      <label>Creado por <strong style="color:var(--muted)">${esc(t.created_by_name||'Admin')}</strong> · ${date}</label>
    </div>`

  document.getElementById('detailOverlay').classList.add('open')
}

async function moveFromDetail(id, status) {
  await moveTask({stopPropagation:()=>{}}, id, status)
  openDetail(id)
}

function closeDetailPanel() {
  document.getElementById('detailOverlay').classList.remove('open')
}

function onDetailOverlayClick(e) {
  if (e.target === document.getElementById('detailOverlay')) closeDetailPanel()
}

// ─── MISC ───
function setNoteFilter(f) { noteFilter = f; renderNotes() }
function setBadge(n) { const b = document.getElementById('urgBadge'); b.hidden = n===0; b.textContent = n }

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}

function toast(msg, isErr = false) {
  const el = document.createElement('div')
  el.className = 'toast' + (isErr?' err':' ok')
  el.textContent = msg
  document.getElementById('toasts').appendChild(el)
  setTimeout(() => el.remove(), 4200)
}

function timeAgo(iso) {
  const m = Math.floor((Date.now() - new Date(iso)) / 60000)
  if (m < 1) return 'Ahora mismo'
  if (m < 60) return `Hace ${m} min`
  const h = Math.floor(m / 60)
  if (h < 24) return `Hace ${h}h`
  return `Hace ${Math.floor(h/24)}d`
}

// ─── KEYBOARD & CLICK HANDLERS ───
document.querySelectorAll('.modal').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) closeModal(el.id) })
})
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal.open').forEach(el => closeModal(el.id))
    closeDetailPanel()
    document.getElementById('notifPanel')?.classList.remove('open')
  }
})
// Cerrar el panel de notificaciones al hacer click fuera
document.addEventListener('click', e => {
  const panel = document.getElementById('notifPanel')
  if (panel?.classList.contains('open') && !e.target.closest('.bell-wrap')) {
    panel.classList.remove('open')
  }
})

// ─── BOOT ───
init().catch(err => {
  console.error('WS init error:', err)
  document.getElementById('loadMsg').textContent = 'Error al iniciar. Redirigiendo...'
  setTimeout(() => { window.location.href = '/' }, 2000)
})
</script>
</body>
